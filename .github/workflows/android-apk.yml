# Builds the Android app on every push to main and publishes the APK as a GitHub release, so the app can be
# changed (e.g. from a Claude Code cloud session) and installed on the phone without a PC.
# Latest APK: https://github.com/yusufkaraman/SmartLights/releases/latest/download/SmartLights.apk
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      # The installed app is signed with this key; an APK signed with any other key cannot update it.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is missing"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Check size (must stay under 50 MB)
        run: |
          size=$(stat -c %s android/app/build/outputs/apk/release/app-release.apk)
          echo "APK size: $((size/1024/1024)) MB"
          if [ "$size" -gt $((50*1024*1024)) ]; then echo "::error::APK is over 50 MB"; exit 1; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SmartLights.apk
          gh release create "build-${{ github.run_number }}" SmartLights.apk \
            --title "SmartLights build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s) (${GITHUB_SHA::7})" \
            --latest
